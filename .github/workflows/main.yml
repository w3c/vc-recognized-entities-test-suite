name: Generate W3C Interoperability Report

on:
  workflow_dispatch:
  push:
  schedule:
    # update the interoperability report once per week at Sunday 5am UTC
    - cron: '0 5 * * 0'

jobs:
  lint:
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Run eslint
        run: npm run lint
  test-node:
    permissions:
      contents: write  # Only this job needs write access
      pages: write
    if: ${{ github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install npm dependencies
        run: npm install
      - name: Run test with Node.js ${{ matrix.node-version }}
        run: npm run test
        continue-on-error: true
      - name: Add the hosted fixtures to the report site
        run: cp -r fixtures reports/fixtures
      - name: Deploy to Github Pages
        uses: JamesIves/github-pages-deploy-action@6c2d9db40f9296374acc17b90404b6e8864128c8 # v4.7.3
        with:
          branch: gh-pages
          folder: reports
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report Github Pages Deployment Status
        run: echo $deployment_status
